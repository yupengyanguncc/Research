name: Ruby Setup

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04  # 使用稳定的 Ubuntu 22.04 版本
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2.0'  # 更新到 3.2.0 以获得更新的 RubyGems
        bundler-cache: true
        bundler: '2.5.9'  # 保持与 lockfile 匹配的版本
    
    - name: Configure Bundler
      run: |
        bundle config set --local deployment false
        bundle config set --local frozen false
    
    - name: Install dependencies
      run: bundle install