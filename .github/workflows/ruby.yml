name: Ruby Setup

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04  # 使用稳定的 Ubuntu 22.04 版本
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.0.0'  # 使用更稳定的 Ruby 版本
        bundler-cache: true
        bundler: '2.4.22'
    
    - name: Configure Bundler
      run: |
        bundle config set --local deployment false
        bundle config set --local frozen false
    
    - name: Install dependencies
      run: bundle install